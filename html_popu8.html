            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f3efe7;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #2e2c28;
            line-height: 1.5;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.04"/></svg>');
            pointer-events: none;
            z-index: 0;
        }

        .library {
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header-card {
            background: #fdfbf6;
            border-radius: 6px 38px 6px 38px;
            padding: 1.75rem 2rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(178, 170, 148, 0.25);
            box-shadow: 0 1px 4px rgba(62, 55, 40, 0.04);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.25rem;
            transition: all 0.2s ease;
        }

        .header-card:hover {
            background: #faf7f0;
            border-color: rgba(168, 158, 132, 0.35);
            box-shadow: 0 4px 14px rgba(62, 55, 40, 0.05);
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .circle-icon {
            width: 52px;
            height: 52px;
            background: #e8e2d5;
            border-radius: 6px 34px 6px 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 1px solid #cdc4b2;
            color: #5f5a4c;
        }

        .title-text h1 {
            font-weight: 350;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .stamp-badge {
            border: 1px solid rgba(162, 150, 128, 0.4);
            background: rgba(232, 224, 210, 0.5);
            border-radius: 4px 20px 4px 20px;
            padding: 0.15rem 0.9rem;
            font-size: 0.7rem;
            font-weight: 400;
            color: #635e51;
            letter-spacing: 0.2px;
        }

        .sub-line {
            color: #6b6557;
            font-size: 0.85rem;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #eae4d8;
            border-radius: 6px 34px 6px 34px;
            padding: 0.3rem 1.4rem;
            font-size: 0.75rem;
            color: #5a5547;
            border: 1px solid #d6cebc;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #8f9e8b;
            border-radius: 50%;
        }

        .tabs-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 0.4rem 1.2rem;
            border-radius: 4px 22px 4px 22px;
            font-size: 0.8rem;
            font-weight: 380;
            color: #5f5a4e;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(242, 237, 228, 0.6);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #e0d8c8;
            border-color: rgba(158, 148, 128, 0.3);
            color: #2e2c26;
            font-weight: 450;
        }

        .tab-btn:not(.active):hover {
            background: rgba(228, 220, 206, 0.7);
            border-color: rgba(178, 164, 142, 0.25);
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.3rem;
        }

        .component-card {
            background: #fdfbf6;
            border-radius: 5px 28px 5px 28px;
            border: 1px solid rgba(178, 168, 146, 0.25);
            padding: 1.2rem 1.3rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            box-shadow: 0 1px 4px rgba(62, 55, 40, 0.03);
            transition: all 0.2s ease;
        }

        .component-card:hover {
            background: #faf7f0;
            border-color: rgba(158, 148, 128, 0.35);
            box-shadow: 0 6px 16px rgba(62, 55, 40, 0.05);
            transform: translateY(-1px);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-badge {
            background: #e2dacb;
            color: #4f4a3e;
            font-size: 0.6rem;
            padding: 0.15rem 0.9rem;
            border-radius: 4px 18px 4px 18px;
            border: 1px solid rgba(168, 156, 132, 0.25);
            letter-spacing: 0.3px;
        }

        .component-id {
            font-size: 0.6rem;
            color: #8b8574;
        }

        .component-title {
            font-weight: 450;
            font-size: 0.95rem;
            color: #2e2c26;
            letter-spacing: -0.2px;
        }

        .preview-window {
            background: #faf7f1;
            border-radius: 5px 18px 5px 18px;
            border: 1px solid rgba(174, 164, 144, 0.2);
            padding: 0.9rem 1rem;
            min-height: 55px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
        }

        .code-snippet {
            background: #ede7dc;
            border-radius: 4px 16px 4px 16px;
            padding: 0.7rem 1rem;
            font-family: 'Fira Code', 'SF Mono', 'Courier New', monospace;
            font-size: 0.65rem;
            line-height: 1.7;
            color: #3e3b34;
            border: 1px solid rgba(168, 158, 138, 0.2);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            max-height: 120px;
            overflow-y: auto;
        }

        .copy-button {
            align-self: flex-end;
            background: transparent;
            border: 1px solid rgba(158, 148, 128, 0.3);
            padding: 0.25rem 1rem;
            border-radius: 4px 20px 4px 20px;
            font-size: 0.65rem;
            color: #5f5a4c;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.2px;
        }

        .copy-button:hover {
            background: #e4ddce;
            border-color: #b2a58b;
            color: #2e2c26;
        }

        .footer-note {
            margin-top: 2.5rem;
            background: #fdfbf6;
            border-radius: 6px 36px 6px 36px;
            padding: 0.9rem 1.8rem;
            border: 1px solid rgba(178, 168, 146, 0.2);
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #6b6557;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #e2dacb;
            color: #2e2c26;
            padding: 0.6rem 1.6rem;
            border-radius: 6px 30px 6px 30px;
            border: 1px solid #c4baa2;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transform: translateY(1rem);
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            z-index: 10;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

            grid-column: 1 / -1;
            font-weight: 350;
            font-size: 1.3rem;
            color: #4f4a3e;
            padding-top: 1rem;
            margin-bottom: -0.3rem;
            letter-spacing: -0.2px;
            border-bottom: 1px solid rgba(168, 158, 132, 0.2);

            gap: 4px;
            background: #2b2a26;
            padding: 6px 10px;

            height: 24px;

        }

        }

            background: #2E7D32;
        }

            width: 4px;
            height: 4px;
        }

            background: #e8e2d5;
            border-radius: 20px;
        }

            background: #c2b5a5;
            border-radius: 20px;
        }

</head>

                    preview: '<div style="display:flex;align-items:center;gap:12px;padding:10px;background:white;border-radius:8px;border:1px solid #eee;max-width:260px;"><img src="https://picsum.photos/60/60" style="width:60px;height:60px;border-radius:8px;object-fit:cover;"><div><b>Kerkstraat</b><br><span style="font-size:0.8rem;color:#888;">Woning</span></div></div>'
                }
            ];

            // ============================================================
            //  RENDER & INTERACTIE
            // ============================================================
            const grid = document.getElementById('examplesGrid');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            let toastTimer;

            function showToast(text) {
                toastMsg.textContent = text;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function renderCards(filter = 'all') {
                const filtered = allComponents.filter(c => filter === 'all' || c.cat === filter);
                grid.innerHTML = '';
                if (!filtered.length) {
                    grid.innerHTML =
                        '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:#6b6557;">✦ geen componenten in deze categorie</div>';
                    return;
                }
                filtered.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'component-card';
                    card.innerHTML = `
                <div class="card-meta">
                  <span class="category-badge">${c.cat}</span>
                  <span class="component-id">#${c.id}</span>
                </div>
                <div class="component-title">${c.title}</div>
                <div class="preview-window">${c.preview || '—'}</div>
                <div class="code-snippet">${c.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
                <button class="copy-button">📋 kopieer HTML</button>
              `;
                    grid.appendChild(card);
                });

                // event listeners op knoppen
                document.querySelectorAll('.copy-button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const cardEl = e.target.closest('.component-card');
                        const rawCode = cardEl.querySelector('.code-snippet').textContent;
                        // unescape HTML entities terug naar echte code
                        const txt = document.createElement('textarea');
                        txt.innerHTML = rawCode;
                        const decoded = txt.value;
                        navigator.clipboard?.writeText?.(decoded).then(() => showToast(
                            '✦ HTML-code gekopieerd')).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = decoded;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            showToast('✦ HTML-code gekopieerd');
                        });
                    });
                });
            }

            // tab events
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove(
                        'active'));
                    btn.classList.add('active');
                    renderCards(btn.dataset.cat);
                });
            });

            // init
            renderCards('all');
        })();
    </script>
</body>
</html>
