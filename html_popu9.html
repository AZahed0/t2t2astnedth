            padding: 0;
            box-sizing: border-box;
        }

            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;

            z-index: 0;
        }

        .library {
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header-card {
            background: #fdfbf6;
            border-radius: 6px 38px 6px 38px;
            padding: 1.75rem 2rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(178, 170, 148, 0.25);
            box-shadow: 0 1px 4px rgba(62, 55, 40, 0.04);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.25rem;
            transition: all 0.2s ease;
        }

        .header-card:hover {
            background: #faf7f0;
            border-color: rgba(168, 158, 132, 0.35);
            box-shadow: 0 4px 14px rgba(62, 55, 40, 0.05);
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .circle-icon {
            width: 52px;
            height: 52px;
            background: #e8e2d5;
            border-radius: 6px 34px 6px 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 1px solid #cdc4b2;
            color: #5f5a4c;
        }

        .title-text h1 {
            font-weight: 350;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .stamp-badge {
            border: 1px solid rgba(162, 150, 128, 0.4);
            background: rgba(232, 224, 210, 0.5);
            border-radius: 4px 20px 4px 20px;
            padding: 0.15rem 0.9rem;
            font-size: 0.7rem;
            font-weight: 400;
            color: #635e51;
            letter-spacing: 0.2px;

        .sub-line {
            color: #6b6557;
            font-size: 0.85rem;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #eae4d8;
            border-radius: 6px 34px 6px 34px;
            padding: 0.3rem 1.4rem;
            font-size: 0.75rem;
            color: #5a5547;
            border: 1px solid #d6cebc;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #8f9e8b;
            border-radius: 50%;
        }

        .tabs-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 0.4rem 1.2rem;
            border-radius: 4px 22px 4px 22px;
            font-size: 0.8rem;
            font-weight: 380;
            color: #5f5a4e;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(242, 237, 228, 0.6);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

            background: #e0d8c8;
            border-color: rgba(158, 148, 128, 0.3);
            color: #2e2c26;
            font-weight: 450;
        }

        .tab-btn:not(.active):hover {
            background: rgba(228, 220, 206, 0.7);
            border-color: rgba(178, 164, 142, 0.25);
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.3rem;
        }

        .component-card {
            background: #fdfbf6;
            border-radius: 5px 28px 5px 28px;
            border: 1px solid rgba(178, 168, 146, 0.25);
            padding: 1.2rem 1.3rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            box-shadow: 0 1px 4px rgba(62, 55, 40, 0.03);
            transition: all 0.15s ease;
        }

            border-color: rgba(158, 148, 128, 0.35);
            box-shadow: 0 3px 9px rgba(62, 55, 40, 0.06);

        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .category-badge {
            display: inline-block;
            background: rgba(178, 168, 146, 0.18);
            border-radius: 3px 16px 3px 16px;
            padding: 0.25rem 0.75rem;
            font-size: 0.65rem;
            font-weight: 500;
            color: #5f5a4e;
            text-transform: uppercase;
            letter-spacing: 0.3px;

        .component-id {
            font-size: 0.65rem;
            color: #8a8276;
            font-weight: 400;
        }

        .component-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #2e2c26;
            line-height: 1.3;
        }

            background: #faf8f2;
            border: 1px solid rgba(178, 168, 146, 0.15);
            border-radius: 4px;
            padding: 1rem;
            min-height: 60px;
            font-size: 0.9rem;
            overflow-x: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f5a4e;

            background: #f5f3ed;
            border: 1px solid rgba(168, 158, 138, 0.15);
            border-radius: 3px;
            padding: 0.8rem;
            font-family: 'Courier New', monospace;

            color: #3a3530;
            overflow-x: auto;
            max-height: 120px;
            overflow-y: auto;
            word-break: break-all;
            line-height: 1.4;
        }

        .copy-button {
            background: #e8e2d5;
            border: 1px solid #d6cebc;
            border-radius: 4px 20px 4px 20px;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 400;
            color: #5a5547;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
        }

        .copy-button:hover {
            background: #d6cebc;
            border-color: #bfb4a0;
        }

            transform: scale(0.98);
        }

            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2e2c26;
            color: #faf8f2;
            padding: 1rem 1.5rem;

            z-index: 100;
            box-shadow: 0 4px 12px rgba(46, 44, 38, 0.2);
        }

        #toast.show {
            bottom: 2rem;
        }

            }

            let toastTimer;

            function showToast(text) {
                toastMsg.textContent = text;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function renderCards(filter = 'all') {
                const filtered = allComponents.filter(c => filter === 'all' || c.cat === filter);
                grid.innerHTML = '';
                if (!filtered.length) {
                    grid.innerHTML =
                        '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:#6b6557;">✦ geen componenten in deze categorie</div>';
                    return;
                }
                filtered.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'component-card';
                    card.innerHTML = `
                <div class="card-meta">
                  <span class="category-badge">${c.cat}</span>
                  <span class="component-id">#${c.id}</span>
                </div>
                <div class="component-title">${c.title}</div>
                <div class="preview-window">${c.preview || '—'}</div>
                <div class="code-snippet">${c.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
                <button class="copy-button">📋 kopieer HTML</button>
              `;
                    grid.appendChild(card);
                });

                // event listeners op knoppen
                document.querySelectorAll('.copy-button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const cardEl = e.target.closest('.component-card');
                        const rawCode = cardEl.querySelector('.code-snippet').textContent;
                        // unescape HTML entities terug naar echte code
                        const txt = document.createElement('textarea');
                        txt.innerHTML = rawCode;
                        const decoded = txt.value;
                        navigator.clipboard?.writeText?.(decoded).then(() => showToast(
                            '✦ HTML-code gekopieerd')).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = decoded;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            showToast('✦ HTML-code gekopieerd');
                        });
                    });
                });
            }

            // tab events

                    btn.classList.add('active');
                    renderCards(btn.dataset.cat);
                });
            });
