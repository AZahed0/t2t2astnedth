<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 1s ease;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .hint.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <video id="myVideo" autoplay playsinline muted loop>
    <source src="dt_video.mp4" type="video/mp4">
  </video>

  <div class="hint" id="hint">👆 Klik ergens om het geluid in te schakelen</div>

  <script>
    const video = document.getElementById('myVideo');
    const hint = document.getElementById('hint');

    function enableSound() {
      if (video.muted) {
        video.muted = false;
        video.volume = 1.0;
        hint.classList.add('hidden');
        console.log('✅ Geluid ingeschakeld');
      }
    }

    document.addEventListener('click', function firstClick() {
      enableSound();
      document.removeEventListener('click', firstClick);
    }, { once: true });

    document.addEventListener('touchstart', function firstTouch() {
      enableSound();
      document.removeEventListener('touchstart', firstTouch);
    }, { once: true });

    video.addEventListener('loadeddata', function() {
      video.play().catch(() => {
        console.log('⏳ Wachten op interactie van de gebruiker');
      });
    });
  </script>

</body>
</html>
